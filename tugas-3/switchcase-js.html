<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var jawab = prompt("silahkan pilih angka 1-5")
        var hadiah = ""
        switch (jawab) {
            case "1":
                hadiah = "tisue"
                break
            case "2":
                hadiah = "1 kotak kopi"
                break
            case "3":
                hadiah = "stickers"
                break
            case "4":
                hadiah = "minyak goreng"
                break
            case "5":
                hadiah = "uang rp50.000"
                break
            default:
                document.write("oops salah pilih")
        }

        if (hadiah === "") {
            document.write("gagal mendapat hadiah")
        } else {
            document.write("selamat anda mendapat " + hadiah)
        }
    </script>
</body>
</html>
